# 開発用: PostgreSQL + PGroonga（本番はPatroni）、ScalaS3（S3 互換ストレージ。本番は任意の S3 互換ストレージ）、
# Mailpit（送信メールを受け止めるだけのSMTP。http://localhost:8025 で中身を見られる）
name: skiwi  # Docker Compose のプロジェクト名（ディレクトリ名によらず固定）
services:
  db:
    image: groonga/pgroonga:4.1.0-alpine-17-slim
    environment:
      POSTGRES_USER: skiwi
      POSTGRES_PASSWORD: skiwi
      POSTGRES_DB: skiwi
    ports: ["54329:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-skiwi-test.sql:ro   # テスト用DB skiwi_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skiwi"]
      interval: 2s
      retries: 30
  s3:
    build: { context: ./deploy/docker, dockerfile: scalas3.Dockerfile }   # 初回はソースからビルドする
    image: skiwi-scalas3:dev
    environment:
      SCALAS3_ACCESS_KEY: skiwi
      SCALAS3_SECRET_KEY: skiwiskiwiskiwi
    ports: ["3900:3900"]
    volumes: ["s3data:/var/lib/scalas3/data"]
  mail:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
  s3data:
