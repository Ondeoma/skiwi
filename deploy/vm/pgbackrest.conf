# /etc/pgbackrest/pgbackrest.conf（3台とも同じ。リポジトリは S3 互換ストレージの別バケット。可能なら別の拠点にも複製する）
[global]
repo1-type=s3
repo1-s3-endpoint=10.0.0.10
repo1-s3-uri-style=path
repo1-s3-bucket=skiwi-backup
repo1-s3-region=us-east-1
repo1-s3-key=change-me
repo1-s3-key-secret=change-me
repo1-storage-port=7480
# 自己署名の証明書なら、検証を切らずに repo1-storage-ca-file=/etc/pgbackrest/ca.crt で CA を指定する
repo1-storage-verify-tls=n
# バックアップを暗号化する（バケットが漏れても読めないように）。最初の stanza-create の前に決めること（後から変えると既存のバックアップを読めない）
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=change-me
repo1-path=/pgbackrest
repo1-retention-full=4
start-fast=y
compress-type=zst

[skiwi]
pg1-path=/var/lib/postgresql/17/skiwi
pg1-port=5432
